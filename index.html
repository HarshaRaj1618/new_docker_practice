<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Companion · Daily Activities</title>
  <!-- Font Awesome for icons (optional but adds visual flair) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f5f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .gym-app {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 20, 30, 0.08), 0 6px 12px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      padding: 2rem 2rem 2.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0b2b3b;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    h1 i {
      color: #0f8b6b;
      font-size: 2rem;
    }

    .subhead {
      font-size: 1rem;
      color: #56748b;
      margin-bottom: 2rem;
      border-left: 4px solid #0f8b6b;
      padding-left: 1rem;
      font-weight: 400;
    }

    /* ----- FILTER BUTTONS ----- */
    .filter-section {
      margin-bottom: 2.5rem;
    }

    .filter-label {
      font-weight: 600;
      font-size: 1rem;
      color: #1e3b4a;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .filter-btn {
      background: #eef2f7;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e3b4a;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      letter-spacing: 0.01em;
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .filter-btn i {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .filter-btn:hover {
      background: #d9e3ec;
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: #0f8b6b;
      color: white;
      box-shadow: 0 8px 16px -6px rgba(15, 139, 107, 0.3);
    }

    .filter-btn.active i {
      opacity: 1;
    }

    /* ----- EXERCISE GRID ----- */
    .grid-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.3rem;
      flex-wrap: wrap;
    }

    .grid-title h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0b2b3b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .count-badge {
      background: #eef2f7;
      padding: 0.25rem 0.9rem;
      border-radius: 3rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f8b6b;
      margin-left: 0.5rem;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .exercise-card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.4rem 1.3rem 1.3rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.02);
      border: 1px solid #e7edf4;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .exercise-card:hover {
      box-shadow: 0 18px 30px -12px rgba(15, 139, 107, 0.12), 0 4px 12px rgba(0,0,0,0.02);
      border-color: #cbdae7;
      transform: translateY(-3px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .exercise-icon {
      width: 42px;
      height: 42px;
      background: #e4f3ef;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f8b6b;
      font-size: 1.3rem;
    }

    .bodypart-tag {
      background: #eef2f7;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #1e3b4a;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .exercise-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0b2b3b;
      margin-bottom: 0.65rem;
      line-height: 1.3;
    }

    .exercise-desc {
      font-size: 0.9rem;
      color: #3d5b6b;
      line-height: 1.5;
      margin-bottom: 1.1rem;
      flex: 1;
    }

    .exercise-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: #56748b;
      border-top: 1px dashed #d9e2ec;
      padding-top: 0.9rem;
      margin-top: auto;
    }

    .exercise-meta i {
      color: #0f8b6b;
      margin-right: 0.3rem;
      font-size: 0.85rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
    }

    /* empty state */
    .empty-state {
      grid-column: 1 / -1;
      background: #f9fcff;
      border-radius: 2rem;
      padding: 3rem;
      text-align: center;
      color: #56748b;
      border: 2px dashed #cbdae7;
    }

    .empty-state i {
      font-size: 3rem;
      color: #b6cddd;
      margin-bottom: 1rem;
    }

    .empty-state p {
      font-size: 1.1rem;
    }

    /* daily activities footer */
    .daily-activities {
      background: #f0f6fa;
      border-radius: 1.8rem;
      padding: 1.5rem 1.8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      border: 1px solid #dee9f2;
    }

    .activity-text {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 500;
      color: #0b2b3b;
    }

    .activity-text i {
      font-size: 1.3rem;
      color: #0f8b6b;
      background: white;
      padding: 0.5rem;
      border-radius: 1rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.02);
    }

    .activity-stats {
      display: flex;
      gap: 1.2rem;
      font-size: 0.9rem;
      background: white;
      padding: 0.6rem 1.3rem;
      border-radius: 3rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      color: #1e3b4a;
    }

    .activity-stats span i {
      color: #0f8b6b;
      margin-right: 0.3rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .gym-app {
        padding: 1.5rem 1rem;
        border-radius: 1.8rem;
      }
      h1 { font-size: 1.8rem; }
      .filter-btn { padding: 0.6rem 1rem; font-size: 0.8rem; }
      .daily-activities { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="gym-app">
    <header>
      <h1><i class="fas fa-dumbbell"></i> Gym Companion</h1>
      <div class="subhead">Your daily training log & exercise library</div>
    </header>

    <!-- FILTER BY BODY PART -->
    <section class="filter-section">
      <div class="filter-label"><i class="fas fa-filter"></i> Filter by body part</div>
      <div class="filter-buttons" id="filterContainer">
        <button class="filter-btn active" data-filter="all"><i class="fas fa-globe"></i> All</button>
        <button class="filter-btn" data-filter="chest"><i class="fas fa-chess-board"></i> Chest</button>
        <button class="filter-btn" data-filter="back"><i class="fas fa-arrow-up"></i> Back</button>
        <button class="filter-btn" data-filter="legs"><i class="fas fa-walking"></i> Legs</button>
        <button class="filter-btn" data-filter="shoulders"><i class="fas fa-arrows-alt-v"></i> Shoulders</button>
        <button class="filter-btn" data-filter="arms"><i class="fas fa-hand-peace"></i> Arms</button>
        <button class="filter-btn" data-filter="core"><i class="fas fa-circle"></i> Core</button>
      </div>
    </section>

    <!-- EXERCISE GRID WITH DYNAMIC CARDS -->
    <div class="grid-title">
      <h2><i class="fas fa-clipboard-list"></i> Exercises <span class="count-badge" id="exerciseCount">12</span></h2>
      <span style="font-size: 0.85rem; color: #56748b;"><i class="fas fa-rotate-right"></i> updated today</span>
    </div>

    <div class="exercise-grid" id="exerciseGrid"></div>

    <!-- DAILY ACTIVITIES SUMMARY -->
    <div class="daily-activities">
      <div class="activity-text">
        <i class="fas fa-calendar-check"></i>
        <span><strong>Daily activities</strong> · 5 exercises scheduled</span>
      </div>
      <div class="activity-stats">
        <span><i class="fas fa-clock"></i> 45 min</span>
        <span><i class="fas fa-fire"></i> 320 kcal</span>
        <span><i class="fas fa-check-circle"></i> 2 / 5 done</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- EXERCISE DATABASE (with body part & details) ----------
      const exercises = [
        {
          id: 1,
          name: 'Push-Ups',
          bodyPart: 'chest',
          description: 'Classic bodyweight exercise for chest, shoulders and triceps. Keep core tight and lower until elbows are 90°.',
          sets: '4 sets',
          reps: '12–15 reps',
          rest: '60s',
          icon: 'fa-hand-rock'
        },
        {
          id: 2,
          name: 'Incline Dumbbell Press',
          bodyPart: 'chest',
          description: 'Targets upper chest. Lie on an incline bench, press dumbbells upward, control the descent.',
          sets: '3 sets',
          reps: '10–12 reps',
          rest: '75s',
          icon: 'fa-dumbbell'
        },
        {
          id: 3,
          name: 'Pull-Ups',
          bodyPart: 'back',
          description: 'The king of back exercises. Pull yourself up until chin clears the bar, lower with control.',
          sets: '4 sets',
          reps: '6–10 reps',
          rest: '90s',
          icon: 'fa-bars'
        },
        {
          id: 4,
          name: 'Bent-Over Rows',
          bodyPart: 'back',
          description: 'Hinge at hips, row barbell or dumbbells toward your torso, squeezing shoulder blades together.',
          sets: '4 sets',
          reps: '8–12 reps',
          rest: '75s',
          icon: 'fa-arrow-right'
        },
        {
          id: 5,
          name: 'Squats',
          bodyPart: 'legs',
          description: 'Fundamental leg builder. Keep chest up, back straight, and descend until thighs are parallel to floor.',
          sets: '4 sets',
          reps: '10–15 reps',
          rest: '90s',
          icon: 'fa-street-view'
        },
        {
          id: 6,
          name: 'Romanian Deadlifts',
          bodyPart: 'legs',
          description: 'Hinge at hips with a slight knee bend, lower weight while keeping back neutral, feel hamstring stretch.',
          sets: '3 sets',
          reps: '10–12 reps',
          rest: '90s',
          icon: 'fa-weight-hanging'
        },
        {
          id: 7,
          name: 'Overhead Press',
          bodyPart: 'shoulders',
          description: 'Press barbell or dumbbells overhead, engaging core and shoulders. Avoid arching lower back.',
          sets: '4 sets',
          reps: '8–10 reps',
          rest: '90s',
          icon: 'fa-arrow-up'
        },
        {
          id: 8,
          name: 'Lateral Raises',
          bodyPart: 'shoulders',
          description: 'Isolation for side delts. Raise dumbbells to shoulder height with slight elbow bend.',
          sets: '3 sets',
          reps: '12–15 reps',
          rest: '60s',
          icon: 'fa-arrows-alt-h'
        },
        {
          id: 9,
          name: 'Bicep Curls',
          bodyPart: 'arms',
          description: 'Classic bicep builder. Keep elbows pinned to sides, curl weight up and squeeze at top.',
          sets: '3 sets',
          reps: '10–12 reps',
          rest: '60s',
          icon: 'fa-hand-peace'
        },
        {
          id: 10,
          name: 'Tricep Dips',
          bodyPart: 'arms',
          description: 'Use parallel bars or a bench. Lower body until elbows are at 90°, then push back up.',
          sets: '3 sets',
          reps: '8–12 reps',
          rest: '60s',
          icon: 'fa-chevron-down'
        },
        {
          id: 11,
          name: 'Plank',
          bodyPart: 'core',
          description: 'Isometric core hold. Keep body in straight line, engage abs and glutes. Don’t let hips sag.',
          sets: '3 sets',
          reps: '45–60 sec',
          rest: '45s',
          icon: 'fa-minus'
        },
        {
          id: 12,
          name: 'Hanging Leg Raises',
          bodyPart: 'core',
          description: 'Hang from a bar, raise legs to 90° or higher, control the movement. Targets lower abs.',
          sets: '3 sets',
          reps: '10–15 reps',
          rest: '60s',
          icon: 'fa-arrows-alt-v'
        }
      ];

      // DOM elements
      const grid = document.getElementById('exerciseGrid');
      const filterContainer = document.getElementById('filterContainer');
      const exerciseCountSpan = document.getElementById('exerciseCount');

      // ----- RENDER FUNCTION (based on active filter) -----
      function renderExercises(filter = 'all') {
        // Filter exercises
        const filtered = filter === 'all' 
          ? exercises 
          : exercises.filter(ex => ex.bodyPart === filter);

        // Update count badge
        exerciseCountSpan.textContent = filtered.length;

        // If no exercises (edge case)
        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-search"></i>
              <p>No exercises match this body part. Try another filter.</p>
            </div>
          `;
          return;
        }

        // Build cards
        const cardsHTML = filtered.map(ex => {
          // Map body part to icon & readable tag
          const bodyPartIcon = {
            chest: 'fa-chess-board',
            back: 'fa-arrow-up',
            legs: 'fa-walking',
            shoulders: 'fa-arrows-alt-v',
            arms: 'fa-hand-peace',
            core: 'fa-circle'
          }[ex.bodyPart] || 'fa-tag';

          const bodyPartDisplay = ex.bodyPart.charAt(0).toUpperCase() + ex.bodyPart.slice(1);

          return `
            <div class="exercise-card" data-bodypart="${ex.bodyPart}">
              <div class="card-header">
                <div class="exercise-icon">
                  <i class="fas ${ex.icon || 'fa-dumbbell'}"></i>
                </div>
                <span class="bodypart-tag"><i class="fas ${bodyPartIcon}" style="margin-right: 0.2rem;"></i> ${bodyPartDisplay}</span>
              </div>
              <h3>${ex.name}</h3>
              <p class="exercise-desc">${ex.description}</p>
              <div class="exercise-meta">
                <span class="meta-item"><i class="fas fa-layer-group"></i> ${ex.sets}</span>
                <span class="meta-item"><i class="fas fa-redo-alt"></i> ${ex.reps}</span>
                <span class="meta-item"><i class="fas fa-hourglass-half"></i> ${ex.rest}</span>
              </div>
            </div>
          `;
        }).join('');

        grid.innerHTML = cardsHTML;
      }

      // ----- FILTER BUTTON HANDLING -----
      function initFilters() {
        // Add event listeners to all filter buttons
        const buttons = filterContainer.querySelectorAll('.filter-btn');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            // Remove active class from all buttons
            buttons.forEach(b => b.classList.remove('active'));
            // Add active class to clicked button
            btn.classList.add('active');

            // Get filter value
            const filterValue = btn.dataset.filter;
            // Re-render exercises
            renderExercises(filterValue);
          });
        });
      }

      // ----- INITIAL RENDER (all exercises) -----
      renderExercises('all');
      initFilters();

      // Optional: Add small hover effect on cards (already in CSS)
      // But also can log daily activity suggestion (purely cosmetic)
      console.log('🏋️ Gym app ready – filter by body part!');
    })();
  </script>
</body>
</html>
